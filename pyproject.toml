[project]
name = "finalproject-korolev-m26-555"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thekorova", email = "qwerrewq123123123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
finalproject-korolev-m26-555 = "valutatrade_hub:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B"]

[tool.valutatrade]
users_path = "data/users.json"
portfolios_path = "data/portfolios.json"
rates_path = "data/rates.json"
rates_ttl_seconds = 300
base_currency = "USD"
log_format = "text"
log_path = "logs/actions.log"